docs: FAI Chat API

imports:
  commons: ./commons.yml

service:
  auth: false
  base-path: /chat
  endpoints:
    chatCompletion:
      docs: Create a docs chat completion for a given domain
      path: /{domain}
      method: POST
      audiences:
        - customers
      path-parameters:
        domain: string
      request:
        name: ChatCompletionRequest
        body:
          properties:
            model:
              type: LanguageModel
              docs: The model to use for the chat completion.
            system_prompt:
              type: optional<string>
              docs: The system prompt to use for the chat completion.
            messages: 
              type: list<ChatTurn>
              docs: The messages to use for the chat completion.
      response: ChatCompletionResponse
      errors:
        - commons.BadRequestError
        - commons.InternalError

types:
  ChatCompletionResponse:
    properties:
      turns: list<ChatTurn>
      citations: list<string>

  ChatTurn:
    properties:
      role: string
      content: string

  LanguageModel:
    enum:
      - name: claude_4
        value: claude-4-sonnet-20250514
      - name: command_a
        value: command-a-03-2025
