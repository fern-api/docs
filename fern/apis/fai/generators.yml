default-group: local
api:
  specs:
    - openapi: openapi.json
      settings:
        title-as-schema-name: true
        type-dates-as-strings: true
        object-query-parameters: false
        idiomatic-request-names: false
        respect-nullable-schemas: false
        wrap-references-to-nullable-in-optional: true
        coerce-optional-schemas-to-nullable: true
        inline-path-parameters: false
        coerce-enums-to-literals: true
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 2.8.4
        output:
          location: local-file-system
          path: ../../../packages/fai-sdk/src
        config:
          namespaceExport: FernAI
        smart-casing: false
  public-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 2.8.4
        output:
          location: npm
          package-name: '@fern-api/fai-sdk'
          token: ${NPM_TOKEN}
        config:
          namespaceExport: FernAI
        smart-casing: false
  java-sdk:
    generators:
      - name: fernapi/fern-java-sdk
        version: 3.10.3
        output:
          location: maven
          url: maven.buildwithfern.com
          coordinate: com.fern.fern:fai-sdk
        config:
          enable-forward-compatible-enums: true
          enable-wire-tests: false
          package-prefix: com.fern.fai
          client-class-name: FernAI
        smart-casing: false
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.32.2
        output:
          location: pypi
          package-name: fern-fai-sdk
          token: ${PYPI_TOKEN}
        config:
          client_class_name: FernAI
          package_name: fern_fai_sdk
        smart-casing: false
