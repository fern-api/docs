default-group: local

api:
  specs:
    - openapi: openapi.json

groups:
  local:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 2.8.4
        output:
          location: local-file-system
          path: ../../../packages/fai-sdk/src
        config:
          namespaceExport: FernAI

  public-sdk:
    generators:
      - name: fernapi/fern-typescript-node-sdk
        version: 2.8.4
        output:
          location: npm
          package-name: "@fern-api/fai-sdk"
          token: ${NPM_TOKEN}
        config:
          namespaceExport: FernAI
