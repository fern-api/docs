<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="diamond-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.06"/>
    </radialGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dot grid -->
  <g fill="#8B5CF6" opacity="0.18">
    <!-- Row 1 -->
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="240" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="320" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/>
    <!-- Row 2 -->
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/><circle cx="280" cy="80" r="1.5"/><circle cx="320" cy="80" r="1.5"/><circle cx="360" cy="80" r="1.5"/>
    <!-- Row 3 -->
    <circle cx="40" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="160" cy="120" r="1.5"/><circle cx="200" cy="120" r="1.5"/><circle cx="240" cy="120" r="1.5"/><circle cx="280" cy="120" r="1.5"/><circle cx="320" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/>
    <!-- Row 4 -->
    <circle cx="40" cy="160" r="1.5"/><circle cx="80" cy="160" r="1.5"/><circle cx="120" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="280" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="360" cy="160" r="1.5"/>
    <!-- Row 5 -->
    <circle cx="40" cy="200" r="1.5"/><circle cx="80" cy="200" r="1.5"/><circle cx="120" cy="200" r="1.5"/><circle cx="160" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="240" cy="200" r="1.5"/><circle cx="280" cy="200" r="1.5"/><circle cx="320" cy="200" r="1.5"/><circle cx="360" cy="200" r="1.5"/>
    <!-- Row 6 -->
    <circle cx="40" cy="240" r="1.5"/><circle cx="80" cy="240" r="1.5"/><circle cx="120" cy="240" r="1.5"/><circle cx="160" cy="240" r="1.5"/><circle cx="200" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="280" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/><circle cx="360" cy="240" r="1.5"/>
    <!-- Row 7 -->
    <circle cx="40" cy="280" r="1.5"/><circle cx="80" cy="280" r="1.5"/><circle cx="120" cy="280" r="1.5"/><circle cx="160" cy="280" r="1.5"/><circle cx="200" cy="280" r="1.5"/><circle cx="240" cy="280" r="1.5"/><circle cx="280" cy="280" r="1.5"/><circle cx="320" cy="280" r="1.5"/><circle cx="360" cy="280" r="1.5"/>
    <!-- Row 8 -->
    <circle cx="40" cy="320" r="1.5"/><circle cx="80" cy="320" r="1.5"/><circle cx="120" cy="320" r="1.5"/><circle cx="160" cy="320" r="1.5"/><circle cx="200" cy="320" r="1.5"/><circle cx="240" cy="320" r="1.5"/><circle cx="280" cy="320" r="1.5"/><circle cx="320" cy="320" r="1.5"/><circle cx="360" cy="320" r="1.5"/>
    <!-- Row 9 -->
    <circle cx="40" cy="360" r="1.5"/><circle cx="80" cy="360" r="1.5"/><circle cx="120" cy="360" r="1.5"/><circle cx="160" cy="360" r="1.5"/><circle cx="200" cy="360" r="1.5"/><circle cx="240" cy="360" r="1.5"/><circle cx="280" cy="360" r="1.5"/><circle cx="320" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/>
  </g>

  <!-- Radial glow behind diamond -->
  <ellipse cx="200" cy="200" rx="140" ry="140" fill="url(#glow)" filter="url(#blur-glow)"/>

  <!-- Diamond shape -->
  <polygon points="200,80 320,200 200,320 80,200" fill="url(#diamond-fill)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Inner diamond -->
  <polygon points="200,130 270,200 200,270 130,200" fill="none" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Center dot -->
  <circle cx="200" cy="200" r="5" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="200" cy="200" r="10" fill="#8B5CF6" opacity="0.15"/>

  <!-- Corner accent dots (brighter) -->
  <circle cx="200" cy="80" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="320" cy="200" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="200" cy="320" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="80" cy="200" r="3" fill="#A78BFA" opacity="0.8"/>
</svg>