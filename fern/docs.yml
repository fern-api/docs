instances:
  - url: fern.docs.buildwithfern.com/learn
    custom-domain: buildwithfern.com/learn
    edit-this-page:
      github:
        owner: fern-api
        repo: docs
        branch: main
      launch: dashboard

title: Fern Documentation

translations:
  - lang: en
    default: true
  - lang: zh

ai-search:
  location:
    - docs
  datasources:
    - url: https://buildwithfern.com/pricing
      title: Fern pricing

metadata:
  og:dynamic: true
  og:dynamic:show-url: false
  og:dynamic:show-gradient: false
  og:dynamic:show-logo: false
  og:dynamic:background-image: https://fern-docs.s3.us-east-2.amazonaws.com/fern-docs-og_image.png
  canonical-host: buildwithfern.com


products:
  - display-name: Home
    path: ./products/home/home.yml
    image: ./images/product-switcher/product-switcher-home-light.png
    subtitle: Products that elevate your developer experience 
  
  - display-name: SDKs
    path: ./products/sdks/sdks.yml
    icon: fa-brands fa-codepen
    image: ./images/product-switcher/product-switcher-sdks-light.png
    slug: sdks
    subtitle: Generate client libraries in multiple languages

  - display-name: CLI Generator
    path: ./products/cli-generator/cli-generator.yml
    icon: fa-regular fa-rectangle-terminal
    image: ./images/product-switcher/product-switcher-cli-generator-light.png
    slug: cli-generator
    subtitle: Generate a CLI from your API definition

  - display-name: Docs
    path: ./products/docs/docs.yml
    icon: fa-regular fa-browser
    image: ./images/product-switcher/product-switcher-docs-light.png
    slug: docs
    subtitle: Generate beautiful, interactive documentation websites

  - display-name: Dashboard
    path: ./products/dashboard/dashboard.yml
    icon: fa-regular fa-grid-2
    image: ./images/product-switcher/product-switcher-dashboard-light.png
    slug: dashboard
    subtitle: Manage your Fern projects and settings

  - display-name: Fern CLI
    subtitle: Manage and configure your Fern projects
    path: ./products/cli-api-reference/cli-api-reference.yml
    icon: fa-regular fa-terminal
    image: ./images/product-switcher/product-switcher-cliapi-light.png
    slug: cli-api-reference

  - display-name: API Definitions
    path: ./products/api-def/api-def.yml
    icon: fa-regular fa-book
    image: ./images/product-switcher/openapi-definition-light.png
    slug: api-definitions
    subtitle: Import and configure your API specifications

  - display-name: OpenAPI
    href: /learn/api-definitions/openapi/overview
    icon: fa-regular fa-book
    image: ./images/product-switcher/openapi-definition-light.png
    subtitle: Define REST and webhook APIs
  
  - display-name: AsyncAPI
    href: /learn/api-definitions/asyncapi/overview
    icon: fa-regular fa-bolt
    image: ./images/product-switcher/asyncapi-light.png
    subtitle: Define event-driven and WebSocket APIs

  - display-name: OpenRPC
    href: /learn/api-definitions/openrpc/overview
    icon: fa-regular fa-code
    image: ./images/product-switcher/openrpc-light.png
    subtitle: Define JSON-RPC APIs
  
  - display-name: gRPC
    href: /learn/api-definitions/grpc/overview
    icon: fa-regular fa-plug
    image: ./images/product-switcher/grpc-light.png
    subtitle: Define APIs with Protocol Buffers

css: ./assets/styles.css

footer: ./components/FernFooter.tsx

navbar-links:
  - type: minimal
    text: Book a demo
    url: https://buildwithfern.com/book-demo?utm_source=fern-docs
  - type: secondary
    text: Log in
    url: https://dashboard.buildwithfern.com/login?utm_source=fern-docs
  - type: filled
    text: Start for free
    url: https://dashboard.buildwithfern.com/sign-up?redirect_on_login=%2Fget-started&utm_source=fern-docs

typography:
  bodyFont:
    name: GT-Planar
    paths:
      - path: ./assets/GT-Planar.woff2
        weight: 400
      - path: ./assets/GT-Planar-Medium.woff2
        weight: 500
      - path: ./assets/GT-Planar-Bold.woff2
        weight: 600 700
  headingsFont:
    name: GT-Planar-Bold
    path: ./assets/GT-Planar-Bold.woff2
    weight: 600 700

logo:
  href: / 
  light: ./images/logo-primary.svg
  dark: ./images/logo-white.svg
  height: 20
colors:
  accent-primary:
    dark: "#70E155"
    light: "#008700"
  background:
    dark: "#111113"
    light: "#FFFFFF"
  border: 
    dark: "#393A40"
    light: "#E0E1E6"
  header-background:
    dark: "#111113"
    light: "#FFFFFF"
  card-background:
    dark: "#222325"
    light: "#FFFFFF"
favicon: ./images/favicon_32.png

layout:
  page-width: 1504px
  header-height: 75px
  searchbar-placement: header
  tabs-placement: header
  mobile-toc: true

theme:
  page-actions: toolbar
  footer-nav: minimal

page-actions:
  options:
    skills:
      title: Install agent skills
      description: Skills for authoring Fern documentation, maintained in our open-source skills repo.
      learn-more-url: https://buildwithfern.com/learn/docs/ai/agent-skills
      repository: https://github.com/fern-api/skills
      install-command: npx skills add fern-api/skills
      skills:
        - name: fern-docs
          description: >-
            Author and edit Fern documentation: MDX pages, navigation, docs.yml
            config, custom components, landing pages, and changelog entries.
          url: https://github.com/fern-api/skills/tree/main/skills/fern-docs

settings:
  http-snippets:
    - curl

js:
  - path: ./rive-animation.js
    strategy: afterInteractive

agents:
  page-directive: "For clean Markdown content of this page, append .md to this URL. For the complete documentation index, see https://buildwithfern.com/learn/llms.txt."

analytics:
  # posthog:
  #   api-key: ${POSTHOG_API_KEY}
  gtm:
    container-id: GTM-55W3VNDW

experimental:
  mdx-components:
    - ./components
    
