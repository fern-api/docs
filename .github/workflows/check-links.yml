name: Check Links

on:
  # Run M/W/F mornings
  schedule:
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

jobs:
  check-links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Create lychee config
        run: |
          cat > lychee.toml << 'EOF'
          # Lychee link checker configuration
          # https://lychee.cli.rs/

          # Verbose mode
          verbose = true

          # Don't show progress bar (cleaner CI output)
          no_progress = true

          # Accept these status codes as valid
          accept = [200, 204, 301, 302, 307, 308]

          # Timeout for each request in seconds
          timeout = 30

          # Number of retries for failed requests
          max_retries = 3

          # Maximum number of concurrent requests
          max_concurrency = 10

          # User agent to avoid being blocked
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # Exclude patterns (regex)
          exclude = [
            # Placeholder/example URLs
            "^https://example\\.com",
            "^https://github\\.com/owner/repo",
            
            # Analytics and tracking
            "^https://us\\.i\\.posthog\\.com",
            "^https://c\\.vialoops\\.com",
            "_vercel/(speed-)?insights",
            
            # Sites that block automated requests
            "^https://docs\\.stack-auth\\.com",
            "^https://www\\.linkedin\\.com",
            "^https://linkedin\\.com",
            "^https://twitter\\.com",
            "^https://x\\.com",
            
            # Non-HTTP links
            "^mailto:",
            "^tel:",
            "^javascript:",
            
            # Anchor-only links
            "^#"
          ]

          # Include these file extensions when checking local files
          include_mail = false

          # Output format
          format = "markdown"

          # Cache results to speed up subsequent runs
          cache = true
          EOF

      - name: Check Fern Docs Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml 'https://buildwithfern.com/learn'
          output: ./lychee-report.md
          fail: true
          jobSummary: true

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.md
          if-no-files-found: ignore
