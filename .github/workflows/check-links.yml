name: Check Links

on:
  # Run M/W/F mornings
  schedule:
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:

jobs:
  check-links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Create lychee config
        run: |
          cat > lychee.toml << 'EOF'
          # Lychee link checker configuration
          # https://lychee.cli.rs/

          # Accept these status codes as valid
          # 429 is included to handle rate limiting (especially from GitHub)
          accept = [200, 204, 301, 302, 307, 308, 429]

          # User agent to avoid being blocked
          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # Exclude patterns (regex)
          exclude = [
            # Placeholder/example URLs
            "^https://example\\.com",
            "^https://github\\.com/owner/repo",
            
            # Analytics and tracking
            "^https://us\\.i\\.posthog\\.com",
            "^https://c\\.vialoops\\.com",
            "_vercel/(speed-)?insights",
            
              # Sites that block automated requests
              "^https://docs\\.stack-auth\\.com",
              "^https://www\\.linkedin\\.com",
              "^https://linkedin\\.com",
              "^https://twitter\\.com",
              "^https://x\\.com",
              "^https://www\\.npmjs\\.com",
              "^https://cdn\\.simpleicons\\.org",
            
            # Non-HTTP links
            "^mailto:",
            "^tel:",
            "^javascript:",
            
            # Anchor-only links
            "^#"
          ]
          EOF

      - name: Fetch sitemap and extract URLs
        run: |
          curl -s https://buildwithfern.com/learn/sitemap.xml | grep -oP '(?<=<loc>)[^<]+' > urls.txt
          echo "Found $(wc -l < urls.txt) URLs in sitemap"

      - name: Check Fern Docs Links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --timeout 30
            --max-retries 3
            --max-concurrency 10
            --files-from urls.txt
          output: ./lychee-report.md
          format: markdown
          fail: true
          jobSummary: true

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.md
          if-no-files-found: ignore
