name: Vale style check
on: 
  push:
    branches:
      - main
      - '**'
    paths:
      - '**.mdx'
      - '**.md'
      - '.vale/**'
      - '.vale.ini'
  pull_request:
    paths:
      - '**.mdx'
      - '**.md'
      - '.vale/**'
      - '.vale.ini'

jobs:
  vale:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions' &&
      github.actor != 'fern-support'
    steps:
      - uses: actions/checkout@v4
      
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: fern
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}