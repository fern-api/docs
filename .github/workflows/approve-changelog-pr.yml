name: Approve Changelog PR

on:
  repository_dispatch:
    types: [approve-changelog-pr]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ github.event.client_payload.pull_number }} --repo fern-api/docs --approve
