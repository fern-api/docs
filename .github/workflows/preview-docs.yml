name: Preview Docs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
          git checkout pr-${{ github.event.pull_request.number }}

      - name: Install Fern
        run: npm install -g fern-api@latest

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          OUTPUT=$(fern generate --docs --preview --instance fern-api.docs.buildwithfern.com/learn 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Get changed MDX files and slugs
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.mdx' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Build JSON array of changed files with their slugs
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" | while read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              # Try to extract slug from frontmatter
              SLUG=$(sed -n '/^---$/,/^---$/p' "$file" | grep -E '^slug:' | sed 's/^slug:[[:space:]]*//' | tr -d '"' | tr -d "'" || echo "")
              
              if [ -z "$SLUG" ]; then
                # Derive slug from file path (remove fern/products prefix, pages folder, and .mdx extension)
                SLUG=$(echo "$file" | sed 's|^fern/products/[^/]*/||' | sed 's|^pages/||' | sed 's|\.mdx$||' | sed 's|/index$||')
              fi
              
              echo "${file}|${SLUG}"
            fi
          done
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.generate-docs.outputs.preview_url }}';
            const hasChanges = '${{ steps.changed-files.outputs.has_changes }}' === 'true';
            const changesRaw = `${{ steps.changed-files.outputs.changes }}`;
            
            let body = `:herb: **Preview your docs:** <${previewUrl}>\n\n`;
            
            if (hasChanges && changesRaw.trim()) {
              const baseUrl = previewUrl ? new URL(previewUrl).origin : '';
              
              body += `### Changed pages:\n\n`;
              
              const lines = changesRaw.trim().split('\n').filter(line => line.trim());
              for (const line of lines) {
                const [file, slug] = line.split('|');
                if (file && slug) {
                  const pageUrl = `${baseUrl}/${slug}`;
                  body += `- \`${file}\` → [${slug}](${pageUrl})\n`;
                }
              }
            }
            
            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes(':herb: **Preview your docs:**')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
