name: Preview Docs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Only for commenting
      contents: read # For checking out code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout PR
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
          git checkout pr-${{ github.event.pull_request.number }}

      - name: Install Fern
        run: npm install -g fern-api

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          OUTPUT=$(fern generate --docs --preview --instance fern-api.docs.buildwithfern.com/learn 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Get changed MDX files and generate page links
        id: page-links
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          PREVIEW_URL="${{ steps.generate-docs.outputs.preview_url }}"
          
          # Get the list of changed .mdx files in the PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.mdx' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "No .mdx files changed or no preview URL"
            echo "page_links=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Changed MDX files:"
          echo "$CHANGED_FILES"
          
          # Convert newline-separated files to comma-separated for API call
          FILES_PARAM=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
          
          # Call the API endpoint to get slugs for changed files
          # The preview URL format is: https://fern-preview-{id}.docs.buildwithfern.com/learn
          API_URL="${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}"
          
          echo "Calling API: $API_URL"
          
          # Make API request with FERN_TOKEN for authentication (allows access to authed sites)
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -H "FERN_TOKEN: $FERN_TOKEN" "$API_URL" 2>/dev/null || echo "")
          
          # Extract HTTP status code and response body
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')
          
          echo "API Response (HTTP $HTTP_CODE): $RESPONSE"
          
          # Handle errors gracefully - skip page links on any error
          if [ -z "$RESPONSE" ] || [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed or returned error (HTTP $HTTP_CODE), skipping page links"
            echo "page_links=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if response contains an error field
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
          if [ -n "$API_ERROR" ]; then
            echo "API returned error: $API_ERROR, skipping page links"
            echo "page_links=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse the response and generate page links
          PAGE_LINKS=""
          MAPPINGS=$(echo "$RESPONSE" | jq -c '.mappings // []')
          
          for row in $(echo "$MAPPINGS" | jq -c '.[]'); do
            FILE_PATH=$(echo "$row" | jq -r '.filePath')
            SLUG=$(echo "$row" | jq -r '.slug')
            
            if [ "$SLUG" != "null" ] && [ -n "$SLUG" ]; then
              FILENAME=$(basename "$FILE_PATH" .mdx)
              PAGE_LINKS="${PAGE_LINKS}\n- [${FILENAME}](${PREVIEW_URL}/${SLUG})"
            fi
          done
          
          # Store the page links
          if [ -n "$PAGE_LINKS" ]; then
            echo "page_links<<EOF" >> $GITHUB_OUTPUT
            echo -e "$PAGE_LINKS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "page_links=" >> $GITHUB_OUTPUT
          fi

      - name: Create comment content
        run: |
          echo "🌿 Preview your docs: ${{ steps.generate-docs.outputs.preview_url }}" > preview_url.txt
          
          if [ -n "${{ steps.page-links.outputs.page_links }}" ]; then
            echo "" >> preview_url.txt
            echo "**Pages changed in this PR:**" >> preview_url.txt
            echo "${{ steps.page-links.outputs.page_links }}" >> preview_url.txt
          fi

      - name: Comment URL in PR
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          filePath: preview_url.txt
