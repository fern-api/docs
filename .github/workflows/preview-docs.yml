name: Preview Docs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Only for commenting
      contents: read # For checking out code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff

      - name: Checkout PR
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
          git checkout pr-${{ github.event.pull_request.number }}

      - name: Install Fern
        run: npm install -g fern-api@latest

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          OUTPUT=$(fern generate --docs --preview --instance fern-api.docs.buildwithfern.com/learn 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()')
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Get changed MDX files
        id: changed-files
        run: |
          PREVIEW_URL="${{ steps.generate-docs.outputs.preview_url }}"
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.mdx' 2>/dev/null || echo "")
          
          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Save changed files to a file for the comment step
          echo "$CHANGED_FILES" > changed_files.txt

      - name: Create comment with changed files
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          PREVIEW_URL="${{ steps.generate-docs.outputs.preview_url }}"
          
          echo ":herb: **Preview your docs:** <${PREVIEW_URL}>" > comment.md
          echo "" >> comment.md
          echo "### Changed MDX files:" >> comment.md
          echo "" >> comment.md
          
          while IFS= read -r file; do
            echo "- \`${file}\`" >> comment.md
          done < changed_files.txt
          
          cat comment.md

      - name: Create comment without changes
        if: steps.changed-files.outputs.has_changes != 'true'
        run: |
          echo ":herb: **Preview your docs:** <${{ steps.generate-docs.outputs.preview_url }}>" > comment.md

      - name: Post PR comment
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          filePath: comment.md
          comment_tag: preview-docs
          mode: upsert
