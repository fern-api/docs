name: Publish Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: | 
          fern generate --docs --instance fern.docs.buildwithfern.com/learn
