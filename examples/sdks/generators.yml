# This file configures all of your SDKs. It should be located at:
# your-source-repo/fern/generators.yml.
default-group: local
groups:
  local:
    generators:
      - name: fernapi/fern-typescript-sdk
        output:
          location: local-file-system
          path: ../sdks/typescript
        version: 2.6.4
  # This group configures a TypeScript SDK for npm publishing
  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 2.6.4
        output:
          location: npm
          package-name: your-unique-package-name
          token: ${NPM_TOKEN}
        config:
          namespaceExport: YourClientName
        github:
          repository: your-company/ts-sdk
          mode: push
          branch: your-branch-name
  # This group configures a Python SDK for PyPi publishing
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.28.0
        output:
          location: pypi
          package-name: your-test-package-name
          token: ${PYPI_TOKEN}
        config:
          client_class_name: YourClientName
        github: 
          repository: your-company/python-sdk
          mode: pull-request
  # This group configures a .NET/C# SDK for NuGet publishing
  csharp-sdk: # group name
    generators:
      - name: fernapi/fern-csharp-sdk
        version: 2.1.15
        output:
          location: nuget
          package-name: YourTestPackageName
          api-key: ${NUGET_API_KEY}
        config:
          client_class_name: YourClientName
        github:
          repository: your-company/csharp-sdk
          mode: release
  # generator groups for other SDKs go here
