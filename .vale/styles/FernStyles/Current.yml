extends: existence
message: "Avoid time-relative terms like '%s' that become outdated"
level: warning
ignorecase: true
tokens:
  - current
  - currently
  - presently
  - as of now
  - at this time
  - present
  - in the future
  - future
  - now
  - today
  - soon
  - latest
  - new
  - upcoming
  - old