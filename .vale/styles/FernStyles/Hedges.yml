extends: existence
message: "Avoid hedge words and filler like '%s'. Prefer direct statements."
level: suggestion
ignorecase: true
tokens:
  - simply
  - just
  - make sure you
  - make sure to
  - be sure to
  - you'll want to
  - you'll need to
  - you may want to
  - you might want to
  - please note that
  - it is important to note
  - it should be noted
  - note that
  - keep in mind
