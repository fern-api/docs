extends: capitalization
message: "'%s' should use sentence-style capitalization."
link: https://docs.microsoft.com/en-us/style-guide/capitalization
level: suggestion
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  - CLI
  - Docker
  - I
  - Linux
  - macOS
  - Marketplace
  - MongoDB
  - REPL
  - Studio
  - TypeScript
  - URLs
  - Visual
  - VS
  - Windows
  - CNAME
  - DNS
  - Fern
  - Support
  - Markdown
  - Docs
  - Mono
  - Unity
  - SDK
  - SDKs
