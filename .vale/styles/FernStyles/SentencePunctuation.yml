extends: existence
message: "Missing punctuation between sentences. Add ., ?, !, or ;"
link: https://learn.microsoft.com/en-us/style-guide/punctuation/periods
level: warning
scope: paragraph
nonword: true

# Heuristics:
# 1) Previous token ends with a lowercase letter/digit/closer, then a space, then a common sentence-starter.
# 2) Previous token ends with a lowercase letter/digit/closer, then a space, then a Capitalized word followed by a common auxiliary/verb.
# These aim to reduce false positives like "API Reference" and "John Smith".
tokens:
  - "([a-z0-9\\)\\]\\\"\\'\\'\\"])\\s+(This|That|These|Those|We|You|They|It|I|The|A|An|In|On|At|If|When|While|After|Before|However|Therefore|Then|Next|Finally|Also|Note|To)\\b"
  - "([a-z0-9\\)\\]\\\"\\'\\'\\"])\\s+([A-Z][a-z]+)\\s+(is|are|was|were|has|have|can|could|should|will|would|do|does|did)\\b"
